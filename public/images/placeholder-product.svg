<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00695C" />
      <stop offset="100%" stop-color="#004D40" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)" />

  <!-- Center Card Area -->
  <g transform="translate(100, 100)" filter="url(#softShadow)">
    <rect width="300" height="240" rx="20" fill="#FFFFFF" />
    
    <!-- Camera / Product Box Outline -->
    <g transform="translate(110, 60)">
      <!-- Soft circle back -->
      <circle cx="40" cy="40" r="46" fill="#E0F2F1" />
      <!-- Product Icon (Package / Shopping Bag / Device) -->
      <path d="M40 16 C26.745 16 16 26.745 16 40 C16 53.255 26.745 64 40 64 C53.255 64 64 53.255 64 40 C64 26.745 53.255 16 40 16 Z M33 28 L47 28 C48.65 28 50 29.35 50 31 L50 49 C50 50.65 48.65 52 47 52 L33 52 C31.35 52 30 50.65 30 49 L30 31 C30 29.35 31.35 28 33 28 Z M40 34 C36.686 34 34 36.686 34 40 C34 43.314 36.686 46 40 46 C43.314 46 46 43.314 46 40 C46 36.686 43.314 34 40 34 Z" fill="url(#iconGrad)" />
    </g>

    <!-- Subtitle Text -->
    <text x="150" y="175" text-anchor="middle" font-family="'Noto Sans Lao', system-ui, sans-serif" font-size="15" font-weight="600" fill="#00695C">
      olaa.la
    </text>
    <text x="150" y="200" text-anchor="middle" font-family="'Noto Sans Lao', system-ui, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
      ຮູບພາບສິນຄ້າກຳລັງອັບເດດ
    </text>
  </g>
</svg>
